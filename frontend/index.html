<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The favicon is the real BlockTrace monogram, not a stand-in. The previous
      favicon.svg was a hand-drawn placeholder that shared no geometry, colours
      or proportions with the brand, so the tab and the app were two different
      products. Assets are generated by tools/build_brand_assets.py.

      PNG rather than SVG because the mark is raster artwork: tracing it into
      paths by hand would produce something that is nearly, but not exactly,
      the logo -- and a near-miss favicon is worse than an honest small render.
    -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/favicon-256.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlockTrace</title>
    <script>
      /*
       * Apply the stored theme before the first paint.
       *
       * The `.dark` class drives every `dark:` utility in the Dashboard 01
       * components, and React only mounts after the stylesheet has already
       * rendered. Without this, every first-time visitor gets a full white
       * flash on each page load before `ThemeToggle` corrects it.
       *
       * Dark is the default, so only an explicit stored "light" turns it off.
       * The operating system is not consulted: an operator who picked light
       * should not have it change at sunset, and one who picked nothing should
       * not be moved by a setting they never touched.
       *
       * This must stay in step with `components/theme-toggle.jsx`.
       */
      (function () {
        try {
          var light = window.localStorage.getItem("blocktrace.theme") === "light";
          document.documentElement.classList.toggle("dark", !light);
        } catch (e) {
          /* storage unavailable: dark is the default anyway */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
